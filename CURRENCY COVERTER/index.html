<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency converter (USD to UGX)</title>
    <link rel="stylesheet" href="style.css">
    <script src="https: //code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <div class="converter-container">
        <h2>Currency Converter (USD to UGX) </h2>

        <label for="usdAmount">Enter Amount(USD):</label>
        <input type="number" id="usdAmount" placeholder="Enter USD Amount">

        <label for="exchangeRate">Enter Exchange Rate:</label>
        <input type="number" id="exchangeRate" placeholder="Enter exchange rate">

        <button id="convertBtn">Convert</button>
        <h3>Converted Amount: <span id="convertedAmount" >0 UGX</span></h3>
    </div>
    <script src="script.js"></script>
</body>
</html>
